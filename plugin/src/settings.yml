---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: node
refresh_interval_floor: '5'
polling_url: "{% if mode == 'archive' or mode == 'on_this_day' %}{% else %}{% if language != blank and language != 'auto' %}{% assign l = language %}{% else %}{% assign l = trmnl.user.locale | slice: 0, 2 | downcase %}{% endif %}{% if l == blank %}{% assign l = 'en' %}{% endif %}https://commons.wikimedia.org/w/api.php?action=featuredfeed&feed=potd&feedformat=atom&language={{ l }}{% if l != 'en' %}\r\nhttps://commons.wikimedia.org/w/api.php?action=featuredfeed&feed=potd&feedformat=atom&language=en{% endif %}{% endif %}"
polling_headers: ''
polling_body: ''
id: 507499
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: Shows the Wikimedia Commons Picture of the Day with its caption on your TRMNL. Choose today's picture, the last ten days (in turn or at random), the same date in earlier years, or any day since 2004; the caption language follows your TRMNL account language.<br />Pictures are credited to Wikimedia Commons; each file has its own licence on its Commons page.
  category: nature,art
  github_url: https://github.com/ExcuseMi/trmnl-wikimedia-potd-plugin
  learn_more_url: https://commons.wikimedia.org/wiki/Commons:Picture_of_the_day
- keyname: mode
  field_type: select
  name: Which pictures
  default: today
  help_text: "<b>Today</b>: the newest picture.<br /><b>Last 10 days, in turn</b>: the recent ones, the next at each refresh.<br /><b>Last 10 days, random</b>: one of the recent ones.<br /><b>On this day</b>: this date in an earlier year, a new year at each refresh.<br /><b>Archive</b>: a random day since 2004."
  options:
  - Today: today
  - Last 10 days, in turn: rotate
  - Last 10 days, random: random
  - On this day: on_this_day
  - Archive (since 2004): archive
- keyname: picture_fit
  field_type: select
  name: Picture fit
  default: contain
  help_text: "<b>Whole picture</b>: nothing is cut off, empty space may remain.<br /><b>Fill the area</b>: the picture covers its area, the edges are cropped. On trmnl.com the crop follows the picture's subject (faces first, otherwise the main subject)."
  options:
  - Whole picture: contain
  - Fill the area: cover
- keyname: language
  field_type: select
  name: Language
  default: auto
  optional: true
  help_text: 'The language of the title and description.<br /><b>Account language</b>: the language of your TRMNL account.<br />A language without a text for a picture falls back to English.'
  options:
  - Account language: auto
  - English: en
  - Nederlands: nl
  - Deutsch: de
  - Français: fr
  - Español: es
  - Italiano: it
  - Português: pt
  - Polski: pl
  - 日本語: ja
  - Русский: ru
  - Svenska: sv
  - Čeština: cs
- keyname: show_description
  field_type: boolean
  name: Show title and description
  default: 'true'
  optional: true
  help_text: "<b>On</b>: the title and the story of the picture, from the Commons caption, else from Wikipedia.<br /><b>Off</b>: only the picture, with a small credit in a corner."
- keyname: show_title_bar
  field_type: boolean
  name: Show title bar
  default: 'true'
  optional: true
  help_text: "<b>On</b>: the bar at the bottom with the icon, the name and the day of the picture.<br /><b>Off</b>: the picture and text get that room; the day moves next to the credit."
name: Wikimedia Commons Picture of the Day
description: Daily Commons photo with its story
refresh_interval: 15

refresh_interval_floor:
polling_url:
polling_headers: ''
polling_body: ''
id: 507499
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: Shows the Wikimedia Commons Picture of the Day with its caption. Choose today's picture, the last ten days (in turn or at random), the same date in earlier years, or any day since 2004. The caption language follows your TRMNL account language.<br />Pictures are credited to Wikimedia Commons; each file has its own licence on its Commons page.
  category: nature,art
  github_url:
  learn_more_url: https://commons.wikimedia.org/wiki/Commons:Picture_of_the_day
- keyname: mode
  field_type: select
  name: Pictures
  default: today
  help_text: Which picture each refresh shows.
  options:
  - Today's picture: today
  - The last 10 days, one after another: rotate
  - The last 10 days, at random: random
  - On this day in earlier years: on_this_day
  - Any day since 2004 (archive): archive
- keyname: show_description
  field_type: boolean
  name: Show title and description
  default: 'true'
  optional: true
  help_text: 'Off: only the picture, with a small credit in a corner. The text comes from the Commons caption, else from Wikipedia.'
name: Wikimedia Commons Picture of the Day
description: Daily Commons photo with its story
refresh_interval: 360
